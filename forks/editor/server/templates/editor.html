<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VizTR Editor</title>
    <link rel="stylesheet" href="/css/editor.css">
    <link rel="stylesheet" href="/css/code-editor.css">
    <style>
        /* VizTR Brand Overrides */
        .playcanvas-icon::after {
            background-image: url('/images/viztr-editor-icon.svg') !important;
            background-size: 18px 18px !important;
        }
        .toolbar .logo .pcui-element {
            background-image: url('/images/viztr-editor-icon.svg') !important;
        }
        #progress-bar {
            background-color: #3ECF8E !important;
        }
    </style>
</head>
<body>
    <script>
        window.onerror = function(msg, url, line, col, error) {
            console.error('[Editor Window Error]', msg, url, line, col, error);
        };
    </script>
    <script>
        var config = __CONFIG__;
        if (config && config.self) {
            config.self.flags = config.self.flags || {};
            config.self.flags.tips = Object.assign({
                hierarchy: true,
                assets: true,
                store: true,
                dashboard: true,
                entityInspector: true,
                soundComponent: true,
                mainMenu: false,
                controls: true,
                launch: true,
                howdoi: true
            }, config.self.flags.tips || {});
        }
    </script>
    <script src="/js/editor.js"></script>
    <script>
        // VizTR Branding Overrides — replaces PlayCanvas logos and text at runtime
        (function() {
            var VIZTR_LOGO = '/images/viztr-logo-white.svg';
            var VIZTR_LOGO_360 = '/images/viztr-logo-360.svg';

            // 1. Override splash screen logo (intercept image loads)
            var origCreateElement = document.createElement.bind(document);
            document.createElement = function(tag) {
                var el = origCreateElement(tag);
                if (tag.toLowerCase() === 'img') {
                    var origSrcSet = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src').set;
                    Object.defineProperty(el, 'src', {
                        set: function(val) {
                            if (val && val.indexOf('playcanvas.com') !== -1 && val.indexOf('logo') !== -1) {
                                val = VIZTR_LOGO;
                            }
                            if (val && val.indexOf('playcanvas.com') !== -1 && val.indexOf('play_text') !== -1) {
                                val = VIZTR_LOGO;
                            }
                            if (val && val.indexOf('playcanvas.com') !== -1 && val.indexOf('playcanvas-logo') !== -1) {
                                val = VIZTR_LOGO_360;
                            }
                            origSrcSet.call(el, val);
                        },
                        get: function() {
                            return Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src').get.call(el);
                        },
                        configurable: true
                    });
                }
                return el;
            };

            // 2. Replace PlayCanvas text with VizTR after editor loads
            function replaceBranding() {
                if (typeof editor === 'undefined' || !editor.call) {
                    setTimeout(replaceBranding, 500);
                    return;
                }
                setTimeout(function() {
                    // Replace text content in DOM
                    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
                    var textNodes = [];
                    while (walker.nextNode()) textNodes.push(walker.currentNode);
                    textNodes.forEach(function(node) {
                        if (node.nodeValue) {
                            if (node.nodeValue.indexOf('PlayCanvas Asset Store') !== -1) {
                                node.nodeValue = node.nodeValue.replace('PlayCanvas Asset Store', 'VizTR Asset Store');
                            } else if (node.nodeValue.indexOf('PLAYCANVAS ASSET STORE') !== -1) {
                                node.nodeValue = node.nodeValue.replace('PLAYCANVAS ASSET STORE', 'VIZTR ASSET STORE');
                            } else if (node.nodeValue.indexOf('PLAYCANVAS') !== -1) {
                                node.nodeValue = node.nodeValue.replace('PLAYCANVAS', 'VIZTR');
                            } else if (node.nodeValue.indexOf('PlayCanvas') !== -1) {
                                node.nodeValue = node.nodeValue.replace(/PlayCanvas/g, 'VizTR');
                            }
                        }
                    });

                    // Override editor_logo.png background-image URLs in inline styles
                    var allElements = document.querySelectorAll('[style*="editor_logo"], [style*="playcanvas"]');
                    allElements.forEach(function(el) {
                        el.style.backgroundImage = "url('/images/viztr-editor-icon.svg')";
                    });

                    // Override notification icon
                    if (window.Notification && Notification.permission === 'granted') {
                        // Future notifications will use VizTR icon via service worker
                    }
                }, 2000);
            }
            window.addEventListener('load', function() { setTimeout(replaceBranding, 1000); });

            // 3. Override CSS background-image for editor_logo in guide bubbles
            var style = document.createElement('style');
            style.textContent = [
                '[style*="editor_logo.png"] { background-image: url("/images/viztr-editor-icon.svg") !important; background-size: 18px 18px !important; }',
                '.playcanvas-icon::after { background-image: url("/images/viztr-editor-icon.svg") !important; }',
                '#application-splash img { content: url("/images/viztr-logo-white.svg"); }'
            ].join('\n');
            document.head.appendChild(style);
        })();
    </script>
    <script>
        // Ensure viewport wheel and hover work reliably across all browser environments
        (function() {
            window.addEventListener('wheel', function(e) {
                if (typeof editor === 'undefined' || !editor.emit) return;
                var canvas = document.querySelector('#canvas-3d');
                if (!canvas) return;
                var rect = canvas.getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    editor.emit('viewport:hover', true);
                    editor.emit('viewport:mouse:move', { x: e.clientX - rect.left, y: e.clientY - rect.top, down: false });
                }
            }, { capture: true, passive: false });

            window.addEventListener('mousemove', function(e) {
                if (typeof editor === 'undefined' || !editor.emit) return;
                var canvas = document.querySelector('#canvas-3d');
                if (!canvas) return;
                var rect = canvas.getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    editor.emit('viewport:hover', true);
                }
            }, { capture: true, passive: true });

            // Ensure zoom sensitivity defaults to 10 for smooth natural navigation
            window.addEventListener('load', function() {
                setTimeout(function() {
                    if (typeof editor !== 'undefined' && editor.call) {
                        var userSettings = editor.call('settings:user');
                        if (userSettings && (!userSettings.get('editor.zoomSensitivity') || userSettings.get('editor.zoomSensitivity') < 5)) {
                            userSettings.set('editor.zoomSensitivity', 10);
                        }
                    }
                }, 500);
            });

            // Real-time PlayCanvas engine asset & material bridge
            function setupEngineAssetBridge() {
                if (typeof editor === 'undefined' || !editor.assets) {
                    setTimeout(setupEngineAssetBridge, 300);
                    return;
                }
                var app = (typeof pc !== 'undefined' && pc.Application) ? pc.Application.getApplication() : null;
                if (!app || !app.assets) {
                    setTimeout(setupEngineAssetBridge, 300);
                    return;
                }

                function syncMaterialAsset(editorAsset) {
                    if (!editorAsset || editorAsset.get('type') !== 'material') return;
                    var id = parseInt(editorAsset.get('id'), 10);
                    if (!id) return;
                    var engineAsset = app.assets.get(id);
                    if (!engineAsset) return;

                    try {
                        engineAsset.data = JSON.parse(JSON.stringify(editorAsset.get('data') || {}));
                    } catch (e) {}

                    if (!engineAsset.loaded) {
                        app.assets.load(engineAsset);
                    } else {
                        var handler = app.loader.getHandler('material');
                        if (handler && typeof handler.patch === 'function') {
                            handler.patch(engineAsset, app.assets);
                        }
                    }
                    if (editor.call) editor.call('viewport:render');
                }

                function bindMaterialObserver(editorAsset) {
                    if (!editorAsset || editorAsset.get('type') !== 'material') return;
                    editorAsset.on('*:set', function(path) {
                        if (path && (path.startsWith('data.') || path === 'data')) {
                            syncMaterialAsset(editorAsset);
                        }
                    });
                    syncMaterialAsset(editorAsset);
                }

                function bindEntityRenderBridge(entity) {
                    if (!entity) return;
                    entity.on('components.render.materialAssets:set', function(val) {
                        var curApp = (typeof pc !== 'undefined' && pc.Application) ? pc.Application.getApplication() : null;
                        if (!curApp) return;
                        var resId = entity.get('resource_id');
                        var engineEntity = curApp.root.findByGuid ? curApp.root.findByGuid(resId) : null;
                        if (!engineEntity) {
                            engineEntity = curApp.root.findByName(entity.get('name'));
                        }
                        if (engineEntity && engineEntity.render) {
                            engineEntity.render.materialAssets = val;
                        }
                        if (editor.call) editor.call('viewport:render');
                    });
                }

                // Bind existing assets
                var existingAssets = editor.assets.list();
                for (var i = 0; i < existingAssets.length; i++) {
                    bindMaterialObserver(existingAssets[i]);
                }

                // Bind newly added assets
                editor.assets.on('add', function(asset) {
                    bindMaterialObserver(asset);
                });

                // Bind entity render bridge
                if (editor.entities) {
                    var existingEntities = editor.entities.list();
                    for (var j = 0; j < existingEntities.length; j++) {
                        bindEntityRenderBridge(existingEntities[j]);
                    }
                    editor.entities.on('add', function(ent) {
                        bindEntityRenderBridge(ent);
                    });
                }
            }
            window.addEventListener('load', function() {
                setTimeout(setupEngineAssetBridge, 1000);
            });
        })();
    </script>
</body>
</html>
