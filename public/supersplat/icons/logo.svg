<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2c073"/>
      <stop offset="100%" stop-color="#9a7d33"/>
    </linearGradient>
  </defs>

  <g transform="translate(150,150)">
    <!-- viewfinder corners -->
    <path d="M -110,-90 L -110,-120 L -80,-120" stroke="url(#goldGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 110,-90 L 110,-120 L 80,-120" stroke="url(#goldGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M -110,90 L -110,120 L -80,120" stroke="url(#goldGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 110,90 L 110,120 L 80,120" stroke="url(#goldGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- V mark -->
    <path d="M -45,-55 L 0,55 L 45,-55" stroke="url(#goldGrad)" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
