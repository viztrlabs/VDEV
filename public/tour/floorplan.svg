<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#0c0c0f"/>
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#27272a" stroke-width="2" rx="6"/>
  <!-- connecting tour path -->
  <polyline points="60,70 140,70 140,150 240,150 240,70 330,70 330,180 240,180 140,230 60,230"
    fill="none" stroke="#3ecf8e" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="4 4"/>
  <!-- 18 node dots in sequence -->
  <g fill="#18181b" stroke="#3ecf8e" stroke-width="2">
    <circle cx="60"  cy="70"  r="7"/>
    <circle cx="140" cy="70"  r="7"/>
    <circle cx="140" cy="150" r="7"/>
    <circle cx="240" cy="150" r="7"/>
    <circle cx="240" cy="70"  r="7"/>
    <circle cx="330" cy="70"  r="7"/>
    <circle cx="330" cy="180" r="7"/>
    <circle cx="240" cy="180" r="7"/>
    <circle cx="140" cy="230" r="7"/>
    <circle cx="60"  cy="230" r="7"/>
    <circle cx="200" cy="110" r="7"/>
    <circle cx="300" cy="120" r="7"/>
    <circle cx="90"  cy="120" r="7"/>
    <circle cx="190" cy="200" r="7"/>
    <circle cx="300" cy="230" r="7"/>
    <circle cx="60"  cy="160" r="7"/>
    <circle cx="360" cy="120" r="7"/>
    <circle cx="200" cy="60"  r="7"/>
  </g>
  <text x="20" y="290" fill="#52525b" font-family="monospace" font-size="11">LOCAL 360° TOUR · 18 NODES</text>
</svg>
